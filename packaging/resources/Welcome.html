<h2>DJI Mic 3 Bridge</h2>
<p>アプリとCore Audioドライバーをインストールします。<br>
macOS 14以降のApple Silicon／Intel Macに対応しています。</p>
<p><strong>録音を終了し、DJI Mic 3 Bridgeと音声を使用するアプリを閉じてから進めてください。</strong><br>
インストールの最後にCore Audioが再起動し、Macの音声入出力が一時的に切断されます。</p>
<p>アプリは「アプリケーション」、ドライバーは /Library/Audio/Plug-Ins/HAL に配置します。<br>
録音ファイルとユーザー設定は保持します。</p>
</html>
