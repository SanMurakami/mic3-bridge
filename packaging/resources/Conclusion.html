<h2>インストールが完了しました</h2>
<p>「アプリケーション」からDJI Mic 3 Bridgeを開き、初回起動時にマイクへのアクセスを許可してください。</p>
<p>レシーバーをUSB接続し、アプリの「ルーティング」で入力を割り当てます。<br>
DAW側では「DJI Mic3 Matrix」を入力に選択してください。</p>
<p>USBで音声を取り込む場合は、TC出力を N/A に設定してください。</p>
